[package]
name = "perp-dex"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "perp-dex"
path = "src/main.rs"

[dependencies]
actix-web    = "4"
actix-ws     = "0.3"
actix-cors   = "0.7"
tokio        = { version = "1", features = ["full"] }
uuid         = { version = "1", features = ["v4", "serde"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
log          = "0.4"
env_logger   = "0.11"
thiserror    = "1"
anyhow       = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }